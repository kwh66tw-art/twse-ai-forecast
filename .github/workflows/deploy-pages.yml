name: 發佈公開網頁版實證儀表板（GitHub Pages）

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "src/**"
      - "reports/**"
      - "data/predictions_ledger.jsonl"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儀表板檔案
        uses: actions/checkout@v4

      - name: 寫入台灣時間網頁更新時間戳
        run: |
          python3 - <<'PY'
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now_dt = datetime.now(ZoneInfo("Asia/Taipei"))
          deploy_ts = now_dt.strftime("%Y-%m-%d %H:%M:%S (UTC+8)")
          epoch = str(int(now_dt.timestamp()))

          idx_path = Path("dashboard/index.html")
          text = idx_path.read_text(encoding="utf-8")
          text = re.sub(
              r'<span id="deploy-stamp">.*?</span>',
              lambda _: f'<span id="deploy-stamp">{deploy_ts}</span>',
              text,
              flags=re.DOTALL,
          )
          text = re.sub(r'(charts/[a-zA-Z0-9_]+\.png)(\?v=[0-9]+)?', rf'\1?v={epoch}', text)
          idx_path.write_text(text, encoding="utf-8")
          PY

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳儀表板靜態產出
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
