name: 台股大盤每週多週期預測與月度績效稽核

on:
  schedule:
    # UTC 週日 23:50 = 台灣時間每週一 07:50（含 runner 啟動時間約於 07:55~08:05 盤前執行）
    - cron: "50 23 * * 0"
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini API 模型代碼"
        required: false
        default: "gemini-4-neon"
        type: string
      thinking_level:
        description: "思考強度（low / medium / high / xhigh）"
        required: false
        default: "high"
        type: choice
        options:
          - low
          - medium
          - high
          - xhigh
      force_monthly_audit:
        description: "是否強制產出本月績效評估報告"
        required: false
        default: false
        type: boolean
      record_id:
        description: "選填：手動覆寫週次識別碼（例如 2026-W49）"
        required: false
        default: ""
        type: string

concurrency:
  group: twse-weekly-forecast
  cancel-in-progress: false

jobs:
  weekly-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Taipei
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.model || 'gemini-4-neon' }}
      GEMINI_THINKING_LEVEL: ${{ inputs.thinking_level || 'high' }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: 檢出儲存庫與完整歷史帳本
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安裝繁體中文字型（確保視覺化圖表無亂碼）
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 安裝 uv 與 Python 專案相依套件
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步虛擬環境
        run: uv sync --extra dev

      - name: 執行核心邏輯前置單元測試
        run: uv run pytest -v

      - name: 執行五大資料擷取、Gemini 4 Neon 辯證與帳本鎖定
        run: |
          ARGS="--skip-if-exists"
          if [ "${{ inputs.force_monthly_audit }}" = "true" ]; then
            ARGS="$ARGS --force-monthly-audit"
          fi
          if [ -n "${{ inputs.record_id }}" ]; then
            ARGS="$ARGS --record-id ${{ inputs.record_id }}"
          fi
          uv run twse-forecast run-weekly-cloud $ARGS

      - name: 驗證不可竄改 SHA-256 雜湊鏈完整性
        run: uv run twse-forecast verify-ledger

      - name: 輸出本週報告至 GitHub Actions Summary
        run: |
          LATEST_WEEKLY=$(ls -1t reports/weekly/*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_WEEKLY" ]; then
            cat "$LATEST_WEEKLY" >> "$GITHUB_STEP_SUMMARY"
          fi
          LATEST_MONTHLY=$(ls -1t reports/monthly/*.md 2>/dev/null | head -n 1 || true)
          if [ -n "$LATEST_MONTHLY" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            cat "$LATEST_MONTHLY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 自動提交鎖定帳本、週報與儀表板至 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.sqlite data/predictions_ledger.jsonl data/snapshots/ reports/ dashboard/index.html dashboard/charts/
          if git diff --cached --quiet; then
            echo "本週帳本與報表無異動，略過 commit。"
          else
            git commit -m "chore(forecast): lock weekly TWSE forecast [skip ci]"
            git push
          fi

      - name: 上傳報表與互動式儀表板 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twse-forecast-reports
          path: |
            reports/
            dashboard/index.html
            dashboard/charts/
            data/predictions_ledger.jsonl
          retention-days: 90

  deploy-pages:
    needs: weekly-forecast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 檢出最新儀表板產出
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 寫入台灣時間網頁更新時間戳
        run: |
          python3 - <<'PY'
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now_dt = datetime.now(ZoneInfo("Asia/Taipei"))
          deploy_ts = now_dt.strftime("%Y-%m-%d %H:%M:%S (UTC+8)")
          epoch = str(int(now_dt.timestamp()))

          idx_path = Path("dashboard/index.html")
          text = idx_path.read_text(encoding="utf-8")
          text = re.sub(
              r'<span id="deploy-stamp">.*?</span>',
              lambda _: f'<span id="deploy-stamp">{deploy_ts}</span>',
              text,
              flags=re.DOTALL,
          )
          text = re.sub(r'(charts/[a-zA-Z0-9_]+\.png)(\?v=[0-9]+)?', rf'\1?v={epoch}', text)
          idx_path.write_text(text, encoding="utf-8")
          PY

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳儀表板靜態產出
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
